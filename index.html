  <!-- Pick the theme before the first paint: a saved choice wins, then the system setting, then dark. -->
  <script>
    (function () {
      var theme = 'dark';
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
        else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
      } catch (error) { /* storage blocked: keep dark */ }
      document.documentElement.classList.add(theme);
      if (theme === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f4ef');
    })();
  </script>
